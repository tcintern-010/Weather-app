<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Weather App</title>
</head>

<body>
    <main class="card">

        <form class="search">
            <input type="text" id="cityInput" placeholder="enter city name" spellcheck="false" autocomplete="off">
            <button type="submit">
                <img src="assets/images/search.png">
            </button>
            <button type="button" class="theme-toggle" id="themeToggle">🌙</button>
            <ul class="suggestions"></ul>
        </form>

        <p class="error">City not found</p>

        <section class="weather">
            <img src="assets/images/rain.png" class="weather-icon">
            <h1 class="temp">31°c</h1>
            <h2 class="city">Lahore</h2>
            <div class="details">

                <div class="col">
                    <img src="assets/images/humidity.png">
                    <div>
                        <p class="humidity">74%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="assets/images/wind.png">
                    <div>
                        <p class="wind">10%</p>
                        <p>Wind</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="JS/main.js"></script>

</body>

</html>
